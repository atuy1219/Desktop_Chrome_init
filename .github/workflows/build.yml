name: Build LSPosed module

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pin the image so the ubuntu-latest -> Ubuntu 26 migration does not
    # unexpectedly change the Android build environment.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already provide ANDROID_HOME/ANDROID_SDK_ROOT.
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" | tail -20
          ls -la "$ANDROID_HOME/build-tools" | tail -20

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Validate native ELF inventory
        run: python3 -m py_compile tools/inspect_chrome_native.py

      - name: Vendor and verify Chromium share icons
        run: python3 tools/vendor_chromium_share_icons.py

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect and verify APK
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No signed APK found under app/build/outputs/apk/release"
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Generated signed APK: $APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found: $APKSIGNER"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          unzip -Z -1 "$APK" | grep -Fx 'lib/arm64-v8a/libchrome_omnibox_probe.so'
          unzip -Z -1 "$APK" | grep -Fx 'assets/chromium_share_ltr.png'
          unzip -Z -1 "$APK" | grep -Fx 'assets/chromium_share_rtl.png'
          unzip -p "$APK" 'META-INF/xposed/native_init.list' | grep -Fx 'libchrome_omnibox_probe.so'
          unzip -p "$APK" 'lib/arm64-v8a/libchrome_omnibox_probe.so' > "$RUNNER_TEMP/probe.so"
          READELF="$(find "$ANDROID_HOME/ndk" -path '*/bin/llvm-readelf' -type f | sort | tail -1)"
          if [ -z "$READELF" ]; then READELF="$(command -v readelf)"; fi
          "$READELF" -Ws "$RUNNER_TEMP/probe.so" > "$RUNNER_TEMP/probe-symbols.txt"
          grep -F 'Java_com_atuy_chromemobilecompat_ChromeNativeProbe_nativeSnapshot' "$RUNNER_TEMP/probe-symbols.txt"
          grep -F 'JNI_OnLoad' "$RUNNER_TEMP/probe-symbols.txt"
          grep -w native_init "$RUNNER_TEMP/probe-symbols.txt"

          cp "$APK" app/build/outputs/ChromeMobileCompat-release.apk
          ls -lh app/build/outputs/ChromeMobileCompat-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: ChromeMobileCompat-release
          path: app/build/outputs/ChromeMobileCompat-release.apk
          if-no-files-found: error
