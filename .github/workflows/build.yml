name: Build LSPosed module

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already provide ANDROID_HOME/ANDROID_SDK_ROOT
      # and current Android SDK platforms/build-tools. Avoid setup-android@v3:
      # its sdkmanager bootstrap currently tries to resolve the removed "tools"
      # package and can fail before Gradle starts.
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" | tail -20
          ls -la "$ANDROID_HOME/build-tools" | tail -20

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopChromeInit-release
          path: app/build/outputs/apk/release/app-release.apk
