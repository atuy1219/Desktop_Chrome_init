name: Build LSPosed module

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pin the image so the ubuntu-latest -> Ubuntu 26 migration does not
    # unexpectedly change the Android build environment.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already provide ANDROID_HOME/ANDROID_SDK_ROOT.
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" | tail -20
          ls -la "$ANDROID_HOME/build-tools" | tail -20

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Enforce extensions-only mobile UX policy
        run: |
          set -euo pipefail
          # Chrome's native phone UI must not be overwritten by the module.
          # Check stable forbidden concepts rather than changing R8 symbols.
          if grep -R -n -E 'ChromeInputCompatibility|hasDesktopExperience|isDebounceKeyboardVisibilityEnabled|DeviceInfo[.]isDesktop|IS_DESKTOP_ANDROID|FORCE_DESKTOP_ANDROID' app/src/main/java; then
            echo 'Desktop/UI compatibility hook reintroduced; reject build'
            exit 1
          fi

      - name: Validate offline native-ELF analyzer
        run: python -m py_compile tools/inspect_chrome_native.py

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect and verify APK
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No signed APK found under app/build/outputs/apk/release"
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Generated signed APK: $APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found: $APKSIGNER"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          # The native diagnostic must really be inside the signed module
          # and declared to LSPosed; a compiled .so alone is not injection.
          unzip -Z -1 "$APK" | grep -Fx 'lib/arm64-v8a/libchrome_omnibox_probe.so'
          unzip -p "$APK" 'META-INF/xposed/native_init.list' \
            | grep -Fx 'libchrome_omnibox_probe.so'

          cp "$APK" app/build/outputs/DesktopChromeInit-release.apk
          ls -lh app/build/outputs/DesktopChromeInit-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: DesktopChromeInit-release
          path: app/build/outputs/DesktopChromeInit-release.apk
          if-no-files-found: error
